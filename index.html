<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Score App</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
    }
    button {
      font-size: 1.5rem;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: white;
      cursor: pointer;
    }
    button:active {
      background: #3a7bc8;
    }
  </style>
</head>
<body>
  <h1>Score: <span id="score">0</span></h1>
  <button id="hello-btn">Hello</button>

  <script>
    let score = 0;
    const scoreEl = document.getElementById("score");
    document.getElementById("hello-btn").addEventListener("click", () => {
      score += 1;
      scoreEl.textContent = score;
    });
  </script>
</body>
</html>
